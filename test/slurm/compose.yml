x-provider-build: &provider-build
  args:
    PROVIDER_INSTALL_MODE: ${PROVIDER_INSTALL_MODE:-native}
    PROVIDER_RUNTIME_COMPONENT: ibm-qdmi-device_Runtime
    SETUP_SCRIPT: test/slurm/setup.sh

services:
  controller:
    build: *provider-build
  node1:
    build: *provider-build
  node2:
    build: *provider-build
