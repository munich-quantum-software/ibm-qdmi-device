name: 💸 Live tests · IBM QPU
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  live-tests:
    name: 💸 Live tests · IBM QPU
    if:
      "github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||\n (github.event_name == 'pull_request'
      && github.event.label.name == 'live-qpu-tests' &&\n  github.event.pull_request.head.repo.full_name == github.repository))"
    uses: $/.github/workflows/reusable-live-tests.yml
    with:
      suite: quantum
    secrets:
      IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
      IBM_QUANTUM_INSTANCE_CRN: ${{ secrets.IBM_QUANTUM_INSTANCE_CRN }}
