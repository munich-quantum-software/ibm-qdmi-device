name: Slurm smoke test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  slurm:
    name: Slurm smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: provider
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: munich-quantum-toolkit/core
          ref: 575acd1b9ca52e4608ccf4833e7d60640913cef4 # v4.1.1
          persist-credentials: false
          path: core
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
      - name: Run the device workload
        timeout-minutes: 40
        run: >-
          uv run --no-project core/test/slurm/run_integration.py
          --workload provider --package /workload --package pytest
          --compose-file provider/test/slurm/compose.yml
          --device-license ibm.berlin
          -- python3 /workload/test/slurm/workload.py
