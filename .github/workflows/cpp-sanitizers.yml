name: Native sanitizers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DIBM_QDMI_SANITIZERS="address;undefined"
      - name: Build
        run: cmake --build build/sanitizers --config Debug
      - name: Test
        run: ctest --test-dir build/sanitizers -C Debug --output-on-failure --timeout 600
