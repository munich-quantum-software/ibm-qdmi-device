name: Coverage
on:
  workflow_call:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Configure
        run: cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DIBM_QDMI_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build/coverage --config Debug
      - name: Test native package
        run: ctest --test-dir build/coverage -C Debug --output-on-failure
      - name: Test Python package
        run: uvx nox -s tests-3.14 -- --cov=ibm.qdmi --cov-report=xml:build/python-coverage/coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            build/coverage/**/*.gcda
            build/coverage/**/*.gcno
            build/python-coverage/coverage.xml
      - name: Upload native coverage
        if: vars.CODECOV_ENABLED == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          flags: cpp
          use_oidc: true
          directory: build/coverage
          plugins: gcov
      - name: Upload Python coverage
        if: vars.CODECOV_ENABLED == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          flags: python
          files: build/python-coverage/coverage.xml
          disable_search: true
          plugins: noop
          use_oidc: true
