name: PR hardware request
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  hardware-request:
    name: Validate and run IBM quantum checks
    if: >-
      github.event.label.name == 'live-qpu-tests' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
    with:
      run_hardware: true
    secrets:
      IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
      IBM_QUANTUM_INSTANCE_CRN: ${{ secrets.IBM_QUANTUM_INSTANCE_CRN }}

  required-checks-pass:
    # An ignored label must not publish a skipped required check.
    name: ${{ (github.event.label.name == 'live-qpu-tests' && github.event.pull_request.head.repo.full_name == github.repository) && '🚦 Check' || 'Ignored label' }}
    if: >-
      always() && github.event.label.name == 'live-qpu-tests' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: hardware-request
    runs-on: ubuntu-slim
    steps:
      - name: Require successful validation and execution
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
