name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      additional-cpp-files: |
        .github/workflows/cpp-*.yml
        .github/workflows/live-tests.yml
      additional-python-files: |
        .github/workflows/live-tests.yml
        test/fixtures/**

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        preset:
          - release
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-26
        preset:
          - release
        include:
          - runs-on: macos-26
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-2025
          - windows-11-arm
        preset:
          - release
        include:
          - runs-on: windows-2025
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ubuntu-26.04
      preset-name: sanitizers

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests) || fromJSON(needs.change-detection.outputs.run-python-tests)
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/cpp-coverage.yml

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    permissions:
      contents: read
      pull-requests: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      clang-version: 23
      files-changed-only: true
      cpp-linter-extra-args: "-Wunused-template"

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums", "integration_tests"]'
      draft-sessions: '["tests-3.15", "minimums-3.15", "integration_tests"]'

  python-coverage:
    name: 🐍 Coverage
    needs: python-tests
    permissions:
      contents: read
      id-token: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      enable-ty: true
      enable-mypy: false

  cpp-install-tests:
    name: 📦 C++ installation
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10

  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
          - windows-11-arm
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}

  live-tests:
    name: ☁️ Live tests
    needs: change-detection
    if: >-
      !cancelled()
      && (
        needs.change-detection.outputs.run-cpp-tests == 'true'
        || needs.change-detection.outputs.run-python-tests == 'true'
      )
      && (
        github.event_name != 'workflow_dispatch'
        || github.ref == 'refs/heads/main'
      )
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    uses: $/.github/workflows/live-tests.yml
    with:
      suite: metadata
    secrets:
      IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
      IBM_QUANTUM_INSTANCE_CRN: ${{ secrets.IBM_QUANTUM_INSTANCE_CRN }}

  simulator:
    name: Quantum System simulator
    needs: build-wheel
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-ubuntu-26.04
          path: build/candidate/dist
      - name: Install the tested candidate
        run: |
          uv venv build/candidate/venv
          uv export --locked --only-group test --no-emit-project --output-file build/candidate/requirements.txt
          uv pip install --python build/candidate/venv/bin/python -r build/candidate/requirements.txt
          uv pip install --python build/candidate/venv/bin/python --no-index --find-links build/candidate/dist ibm-qdmi
      - name: Check out Simulated Quantum Resource
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qrmi-community/simulated_quantum_resource
          ref: 0d547e7d329b8bd3315392e9117f116dc1661ddd
          path: build/qsa-sim
          persist-credentials: false
      - name: Install simulator dependencies
        run: |
          uv venv --python 3.12 build/qsa-sim/.venv
          uv pip install --python build/qsa-sim/.venv/bin/python -r build/qsa-sim/requirements.txt "moto[server]==5.2.3"
      - name: Test candidate against Quantum System API and S3
        env:
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
        run: |
          build/qsa-sim/.venv/bin/python -m moto.server -H 127.0.0.1 -p 9000 > build/qsa-sim/moto.log 2>&1 &
          storage_pid=$!
          (
            cd build/qsa-sim
            exec .venv/bin/python -m qsa_sim.app ../../test/fixtures/simulator.yaml
          ) > build/qsa-sim/service.log 2>&1 &
          simulator_pid=$!
          cleanup() {
            result=$?
            kill "$simulator_pid" "$storage_pid" 2>/dev/null || true
            wait "$simulator_pid" "$storage_pid" 2>/dev/null || true
            if [ "$result" -ne 0 ]; then
              tail -n 100 build/qsa-sim/service.log build/qsa-sim/moto.log
            fi
          }
          trap cleanup EXIT
          curl --noproxy '*' -sf --max-time 2 --retry 30 --retry-max-time 60 \
            --retry-all-errors --retry-delay 1 http://127.0.0.1:9000/moto-api/ > /dev/null
          build/qsa-sim/.venv/bin/python -c "import boto3; boto3.client('s3',
            endpoint_url='http://127.0.0.1:9000', aws_access_key_id='synthetic-access',
            aws_secret_access_key='synthetic-secret', region_name='us-east-1').create_bucket(Bucket='qdmi-e2e')"
          curl --noproxy '*' -sf --max-time 2 --retry 30 --retry-max-time 60 \
            --retry-all-errors --retry-delay 1 http://127.0.0.1:8290/version
          build/candidate/venv/bin/python -m pytest -m "simulator and integration" -n 0 --simulator-url http://127.0.0.1:8290
          build/candidate/venv/bin/python -m pytest -m "simulator and not integration" -n 0 --simulator-url http://127.0.0.1:8290

  required-checks-pass:
    name: 🚦 Check
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-sanitizers
      - cpp-coverage
      - cpp-linter
      - python-tests
      - python-coverage
      - python-linter
      - cpp-install-tests
      - build-sdist
      - build-wheel
      - simulator
      - live-tests
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-sanitizers,cpp-install-tests,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel,simulator,' || ''
            }}
            ${{
              (
                !fromJSON(needs.change-detection.outputs.run-cpp-tests)
                && !fromJSON(needs.change-detection.outputs.run-python-tests)
                || github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != github.repository
                || github.event_name == 'workflow_dispatch'
                && github.ref != 'refs/heads/main'
              )
              && 'live-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}
