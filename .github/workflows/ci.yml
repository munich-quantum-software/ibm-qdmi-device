name: Combined IBM access verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-26.04
    env:
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
      - name: Build combined native wheel and tests
        run: |
          uv run --locked --only-group build python -m build --wheel --outdir build/dist -Cbuild-dir=build/native -Ccmake.define.BUILD_IBM_QDMI_TESTS=ON
          cmake --build build/native --target unit_tests integration_tests ibm-qdmi-native-example -j 2
          ctest --test-dir build/native --output-on-failure -j 2
          uv venv build/client
          uv export --locked --only-group test --no-emit-project --output-file build/requirements.txt
          uv pip install --python build/client/bin/python -r build/requirements.txt build/dist/*.whl
      - name: Verify QPY, cloud Executor, Runtime mocks, and selection
        run: build/client/bin/python -m pytest test/python/test_qpy.py test/python/test_executor.py test/python/test_mock.py test/python/test_combined.py -m 'not simulator' -n 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: qrmi-community/simulated_quantum_resource
          ref: 0d547e7d329b8bd3315392e9117f116dc1661ddd
          path: build/qsa-sim
          persist-credentials: false
      - name: Install offline services
        run: |
          uv venv --python 3.12 build/qsa-sim/.venv
          uv pip install --python build/qsa-sim/.venv/bin/python -r build/qsa-sim/requirements.txt "moto[server]==5.2.3"
      - name: Verify installed combined wheel against Quantum System and S3
        run: |
          build/qsa-sim/.venv/bin/python -m moto.server -H 127.0.0.1 -p 9000 > build/moto.log 2>&1 &
          storage_pid=$!
          (cd build/qsa-sim && exec .venv/bin/python -m qsa_sim.app ../../test/fixtures/simulator.yaml) > build/simulator.log 2>&1 &
          simulator_pid=$!
          cleanup() {
            result=$?
            kill "$simulator_pid" "$storage_pid" 2>/dev/null || true
            wait "$simulator_pid" "$storage_pid" 2>/dev/null || true
            if [ "$result" -ne 0 ]; then tail -n 100 build/simulator.log build/moto.log; fi
          }
          trap cleanup EXIT
          curl --noproxy '*' -sf --max-time 2 --retry 30 --retry-max-time 60 --retry-all-errors --retry-delay 1 http://127.0.0.1:9000/moto-api/ > /dev/null
          build/qsa-sim/.venv/bin/python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', aws_access_key_id='synthetic-access', aws_secret_access_key='synthetic-secret', region_name='us-east-1').create_bucket(Bucket='qdmi-e2e')"
          curl --noproxy '*' -sf --max-time 2 --retry 30 --retry-max-time 60 --retry-all-errors --retry-delay 1 http://127.0.0.1:8290/version
          build/client/bin/python -m pytest -m 'simulator and integration' -n 0 --simulator-url http://127.0.0.1:8290
          build/client/bin/python -m pytest test/python/test_quantum_system.py test/python/test_combined.py -m simulator -n 0 --simulator-url http://127.0.0.1:8290
