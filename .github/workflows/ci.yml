name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      run_hardware:
        description: Run bounded IBM quantum checks after fresh offline validation (main only)
        type: boolean
        default: false
        required: true
  workflow_call:
    inputs:
      run_hardware:
        type: boolean
        default: false
    secrets:
      IBM_QUANTUM_API_KEY:
        required: false
      IBM_QUANTUM_INSTANCE_CRN:
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.run_id || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}
permissions:
  contents: read
jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      additional-cpp-files: |
        .github/workflows/cpp-*.yml
        .clang-format
        CMakeLists.txt
        cmake/**
        pyproject.toml
        uv.lock
        noxfile.py
        test/python/**
        examples/native/**
      additional-python-files: |
        .github/workflows/slurm.yml
        test/slurm/**
        .github/workflows/cpp-coverage.yml
        test/fixtures/**
        examples/**
        test/examples/**
      additional-cd-files: |
        .github/workflows/ci.yml
        .github/workflows/hardware.yml
        .github/workflows/label.yml
        LICENSE
        README.md

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm]
        config: [Release]
        include:
          - runs-on: ubuntu-26.04
            config: Debug
    uses: $/.github/workflows/cpp-tests-ubuntu.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26]
        config: [Release]
        include:
          - runs-on: macos-26
            config: Debug
    uses: $/.github/workflows/cpp-tests-macos.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-2025, windows-11-arm]
        config: [Release]
        compiler: [MSVC]
        include:
          - runs-on: windows-2025
            config: Debug
            compiler: MSVC
          - runs-on: windows-2025
            config: Release
            compiler: ClangCL
    uses: $/.github/workflows/cpp-tests-windows.yml
    with:
      compiler: ${{ matrix.compiler }}
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}

  cpp-install-tests:
    name: 📦 Install
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, macos-26, windows-2025]
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}
  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-sanitizers.yml
  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-coverage.yml
    permissions:
      contents: read
      id-token: write
  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: $/.github/workflows/cpp-linter.yml
    with:
      clang-version: 21
      files-changed-only: false
    permissions:
      contents: read
      pull-requests: write
  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      enable-ty: true
      enable-mypy: false
  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums", "native_tests", "examples", "chemistry"]'
      draft-sessions: ${{ inputs.run_hardware && '["tests", "minimums", "native_tests", "examples", "chemistry"]' || '["tests-3.14", "native_tests"]' }}
  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
  slurm-tests:
    name: Slurm
    needs: change-detection
    if: inputs.run_hardware || github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests) || fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: $/.github/workflows/slurm.yml
  documentation:
    name: 📚 Documentation
    uses: $/.github/workflows/documentation.yml
  hardware-request:
    name: Validate hardware request
    if: inputs.run_hardware
    runs-on: ubuntu-slim
    steps:
      - name: Require an authorized first attempt
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$ATTEMPT" != 1 ]]; then
            echo "Hardware requests cannot be rerun. Dispatch or apply the label again for a new request." >&2
            exit 1
          fi
          if [[ "$EVENT" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            exit 0
          fi
          if [[ "$EVENT" == pull_request && "$ACTION" == labeled && "$LABEL" == live-qpu-tests && "$HEAD_REPO" == "$REPOSITORY" ]]; then
            exit 0
          fi
          echo "Hardware requires a main dispatch or the live-qpu-tests label on a same-repository PR." >&2
          exit 1
  offline-checks-pass:
    name: Offline checks
    if: always()
    needs:
      [
        change-detection,
        cpp-tests-ubuntu,
        cpp-tests-macos,
        cpp-tests-windows,
        cpp-install-tests,
        cpp-sanitizers,
        cpp-coverage,
        cpp-linter,
        python-linter,
        python-tests,
        build-sdist,
        build-wheel,
        documentation,
        slurm-tests,
        hardware-request,
        candidate-wheel,
      ]
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !inputs.run_hardware && github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-cpp-tests == 'false'
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-install-tests,cpp-sanitizers,cpp-coverage,' || ''
            }}
            ${{
              !inputs.run_hardware && github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-cpp-tests == 'false' && needs.change-detection.outputs.run-python-tests == 'false'
              && 'slurm-tests,' || ''
            }}
            ${{
              !inputs.run_hardware && github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-cpp-linter == 'false'
              && 'cpp-linter,' || ''
            }}
            ${{
              !inputs.run_hardware && github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-python-linter == 'false'
              && 'python-linter,' || ''
            }}
            ${{
              !inputs.run_hardware && github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-python-tests == 'false' && needs.change-detection.outputs.run-cd == 'false'
              && 'build-sdist,build-wheel,python-tests,' || ''
            }}
            ${{ !inputs.run_hardware && 'hardware-request,candidate-wheel,' || '' }}
          jobs: ${{ toJSON(needs) }}

  candidate-wheel:
    name: Candidate wheel
    needs: hardware-request
    if: needs.hardware-request.result == 'success'
    runs-on: ubuntu-26.04
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - name: Build an sdist and its wheel
        env:
          SKBUILD_BUILD_DIR: build/candidate/wheel/{wheel_tag}/{build_type}
        run: uv run --locked --only-group build python -m build --outdir build/candidate/dist
      - name: Test the installed candidate offline
        run: |
          uv venv build/candidate/venv
          uv export --locked --only-group test --no-emit-project --output-file build/candidate/requirements.txt
          uv pip install --python build/candidate/venv/bin/python -r build/candidate/requirements.txt build/candidate/dist/*.whl
          build/candidate/venv/bin/python -m pytest -m integration -n 0
          build/candidate/venv/bin/python -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: candidate
        with:
          name: hardware-candidate-${{ github.sha }}
          path: build/candidate/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  hardware:
    name: IBM quantum execution
    needs: [offline-checks-pass, candidate-wheel]
    if: >-
      !cancelled() && inputs.run_hardware && github.run_attempt == 1 &&
      needs.offline-checks-pass.result == 'success' && needs.candidate-wheel.result == 'success'
    uses: $/.github/workflows/hardware.yml
    secrets:
      IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
      IBM_QUANTUM_INSTANCE_CRN: ${{ secrets.IBM_QUANTUM_INSTANCE_CRN }}
    permissions:
      contents: read
      actions: read
    with:
      artifact-id: ${{ needs.candidate-wheel.outputs.artifact-id }}
      run-id: ${{ github.run_id }}

  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs: [offline-checks-pass, hardware]
    runs-on: ubuntu-slim
    steps:
      - name: Require offline checks and eligible hardware execution
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{ !inputs.run_hardware && 'hardware' || '' }}
          jobs: ${{ toJSON(needs) }}
