name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      additional-cpp-files: |
        .github/workflows/cpp-*.yml
        .clang-format
        CMakePresets.json
      additional-python-files: test/fixtures/**
      additional-cd-files: |
        .github/workflows/ci.yml
        CMakeLists.txt
        cmake/**
        python/**
        src/**
        include/**
        pyproject.toml
        uv.lock
        LICENSE
        README.md

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm]
        preset: [release]
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26]
        preset: [release]
        include:
          - runs-on: macos-26
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-2025, windows-11-arm]
        preset: [release]
        include:
          - runs-on: windows-2025
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-install-tests:
    name: 📦 Install
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, macos-26, windows-2025]
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}
  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-sanitizers.yml
  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-coverage.yml
    permissions:
      contents: read
      id-token: write
  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      clang-version: 23
      cpp-linter-extra-args: ""
      cpp-linter-ignore-extra: "!include/**"
      files-changed-only: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      enable-ty: true
      enable-mypy: false
  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums", "native_tests"]'
      draft-sessions: '["tests-3.14", "native_tests"]'
  python-coverage:
    name: 🐍 Coverage
    needs: python-tests
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    permissions:
      contents: read
      id-token: write
  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
  documentation:
    name: 📚 Documentation
    uses: $/.github/workflows/documentation.yml

  live-metadata:
    name: IBM metadata
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/live-metadata.yml
    secrets:
      IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
      IBM_QUANTUM_INSTANCE_CRN: ${{ secrets.IBM_QUANTUM_INSTANCE_CRN }}

  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-install-tests
      - cpp-sanitizers
      - cpp-coverage
      - cpp-linter
      - python-linter
      - python-tests
      - python-coverage
      - build-sdist
      - build-wheel
      - documentation
      - live-metadata
    runs-on: ubuntu-slim
    steps:
      - name: Require successful checks
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{ needs.change-detection.outputs.run-cpp-tests == 'false' && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-install-tests,cpp-sanitizers,cpp-coverage,' || '' }}
            ${{ needs.change-detection.outputs.run-cpp-linter == 'false' && 'cpp-linter,' || '' }}
            ${{ needs.change-detection.outputs.run-python-linter == 'false' && 'python-linter,' || '' }}
            ${{ needs.change-detection.outputs.run-python-tests == 'false' && 'python-tests,python-coverage,' || '' }}
            ${{ needs.change-detection.outputs.run-cd == 'false' && 'build-sdist,build-wheel,' || '' }}
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'live-metadata,' || '' }}
          jobs: ${{ toJSON(needs) }}
