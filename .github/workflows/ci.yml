name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@ace7363a2a8e036e5efc6717be67f1eda29a120e # v2.4.2
    with:
      additional-cpp-files: |
        .github/workflows/cpp-*.yml
        .clang-format
        CMakeLists.txt
        cmake/**
        pyproject.toml
        uv.lock
        noxfile.py
        test/python/**
      additional-python-files: |
        .github/workflows/cpp-coverage.yml
        test/fixtures/**
      additional-cd-files: |
        .github/workflows/ci.yml
        LICENSE
        README.md

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
        config: [Release]
        include:
          - runs-on: ubuntu-24.04
            config: Debug
    uses: $/.github/workflows/cpp-tests-ubuntu.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26]
        config: [Release]
        include:
          - runs-on: macos-26
            config: Debug
    uses: $/.github/workflows/cpp-tests-macos.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-2025, windows-11-arm]
        config: [Release]
        compiler: [MSVC]
        include:
          - runs-on: windows-2025
            config: Debug
            compiler: MSVC
          - runs-on: windows-2025
            config: Release
            compiler: ClangCL
    uses: $/.github/workflows/cpp-tests-windows.yml
    with:
      compiler: ${{ matrix.compiler }}
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}

  cpp-install-tests:
    name: 📦 Install
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, macos-26, windows-2025]
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}
  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-sanitizers.yml
  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-coverage.yml
    permissions:
      contents: read
      id-token: write
  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: $/.github/workflows/cpp-linter.yml
    with:
      clang-version: 21
      files-changed-only: false
    permissions:
      contents: read
      pull-requests: write
  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@ace7363a2a8e036e5efc6717be67f1eda29a120e # v2.4.2
    with:
      check-stubs: false
      enable-ty: true
      enable-mypy: false
  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - run: uvx nox -s tests minimums
  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@ace7363a2a8e036e5efc6717be67f1eda29a120e # v2.4.2
  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: github.ref == 'refs/heads/main' || fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@ace7363a2a8e036e5efc6717be67f1eda29a120e # v2.4.2
    with:
      runs-on: ${{ matrix.runs-on }}
  documentation:
    name: 📚 Documentation
    uses: $/.github/workflows/documentation.yml
  offline-checks-pass:
    name: Offline checks
    if: always()
    needs:
      [
        change-detection,
        cpp-tests-ubuntu,
        cpp-tests-macos,
        cpp-tests-windows,
        cpp-install-tests,
        cpp-sanitizers,
        cpp-coverage,
        cpp-linter,
        python-linter,
        python-tests,
        build-sdist,
        build-wheel,
        documentation,
        candidate-wheel,
      ]
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-cpp-tests == 'false'
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-install-tests,cpp-sanitizers,cpp-coverage,' || ''
            }}
            ${{
              github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-cpp-linter == 'false'
              && 'cpp-linter,' || ''
            }}
            ${{
              github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-python-linter == 'false'
              && 'python-linter,' || ''
            }}
            ${{
              github.ref != 'refs/heads/main' && needs.change-detection.outputs.run-python-tests == 'false' && needs.change-detection.outputs.run-cd == 'false'
              && 'build-sdist,build-wheel,python-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}

  candidate-wheel:
    name: Candidate wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - name: Build an sdist and its wheel
        env:
          SKBUILD_BUILD_DIR: build/candidate/wheel/{wheel_tag}/{build_type}
        run: uv run --locked --only-group build python -m build --outdir build/candidate/dist
      - name: Test the installed candidate offline
        run: |
          uv venv build/candidate/venv
          uv export --locked --only-group test --no-emit-project --output-file build/candidate/requirements.txt
          uv pip install --python build/candidate/venv/bin/python -r build/candidate/requirements.txt build/candidate/dist/*.whl
          build/candidate/venv/bin/python -m pytest test/python test/ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-candidate
          path: build/candidate/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  hardware:
    name: IBM quantum execution
    needs: [offline-checks-pass, candidate-wheel]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.offline-checks-pass.result == 'success' && needs.candidate-wheel.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ibm-quantum
    concurrency:
      group: ibm-quantum-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hardware-candidate
          path: build/hardware/dist
      - name: Install the tested candidate
        run: |
          uv venv build/hardware/venv
          uv export --locked --only-group test --no-emit-project --output-file build/hardware/requirements.txt
          uv pip install --python build/hardware/venv/bin/python -r build/hardware/requirements.txt build/hardware/dist/*.whl
      - name: Validate quantum execution
        env:
          IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY }}
          IBM_QUANTUM_INSTANCE_CRN: ${{ secrets.IBM_QUANTUM_INSTANCE_CRN }}
        run: >-
          build/hardware/venv/bin/python -m pytest test/python/test_quantum.py
          --run-quantum --ibm-backend both -n 0 --tb=line --show-capture=no

  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs: [offline-checks-pass, hardware]
    runs-on: ubuntu-slim
    steps:
      - name: Require offline checks and eligible hardware execution
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              (github.ref != 'refs/heads/main' ||
              (github.event_name != 'push' && github.event_name != 'workflow_dispatch')) && 'hardware' || ''
            }}
          jobs: ${{ toJSON(needs) }}
