version: 2

formats:
  - htmlzip

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

build:
  os: ubuntu-26.04
  apt_packages:
    - doxygen
    - libssl-dev
  tools:
    python: "3.14"
  jobs:
    install:
      - >-
        uv sync --locked --no-dev --group docs
        --config-settings-package ibm-qdmi:wheel.cmake=false
    pre_build:
      - >-
        cmake -S . -B build/docs
        -DBUILD_IBM_QDMI_TESTS=OFF -DBUILD_IBM_QDMI_DOCS=ON
      - cmake --build build/docs --target ibm-qdmi-device-docs

# Let Read the Docs provision uv for the custom install command above.
python:
  install:
    - method: uv
      command: sync
