[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=1.0.3" ]


[project]
name = "ibm-qdmi"
description = "IBM quantum execution through QDMI, Qiskit, and PennyLane"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dynamic = [ "version" ]

[[project.authors]]
name = "Marcel Walter"
email = "marcel@mq.sc"

[[project.authors]]
name = "Lukas Burgholzer"
email = "lukas@mq.sc"

[project.optional-dependencies]
pennylane = [ "mqt-core[pennylane,qiskit]~=4.0.0" ]
qiskit = [ "mqt-core[qiskit]~=4.0.0" ]

[project.urls]
Documentation = "https://ibm-qdmi-device.readthedocs.io/en/latest/"
Homepage = "https://github.com/munich-quantum-software/ibm-qdmi-device"
Issues = "https://github.com/munich-quantum-software/ibm-qdmi-device/issues"

[project.scripts]
ibm-qdmi = "ibm.qdmi.__main__:main"

[project.entry-points."pennylane.plugins"]
"ibm.default" = "ibm.qdmi.pennylane:IBMDevice"
"ibm.berlin" = "ibm.qdmi.pennylane:IBMBerlinDevice"
"ibm.aachen" = "ibm.qdmi.pennylane:IBMAachenDevice"


[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  "nox>=2026.8.10",
]
test = [
  "mqt-core[pennylane,qiskit]~=4.0.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
  "pyyaml>=6.0.2",
]
docs = [
  "furo>=2025.12.19",
  "myst-nb>=1.4",
  "sphinx>=9",
  "sphinx-autoapi>=3.6.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
]
build = [
  "build>=1.2.2",
  "scikit-build-core>=1.0.3",
]
examples = [
  { include-group = "test" },
  "cmake>=3.24",
  "mqt-bench>=2.2.2",
  "mqt-core[pennylane,qiskit]~=4.0.0",
  "ninja>=1.5",
]
typecheck = [
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "examples" },
  "nox>=2026.8.10",
]


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/wheel/{wheel_tag}/{build_type}"

[tool.scikit-build.build]
targets = [ "ibm-qdmi-device" ]

[tool.scikit-build.cmake]
version = "CMakeLists.txt"

[tool.scikit-build.cmake.define]
BUILD_IBM_QDMI_TESTS = "OFF"
CMAKE_INSTALL_LIBDIR = "lib"

[tool.scikit-build.ninja]
make-fallback = true

[tool.scikit-build.sdist]

include = [ "python/ibm/qdmi/_version.py" ]
exclude = [
  "**/docs",
  "**/test",
  ".*",
]

[tool.scikit-build.wheel]
py-api = "py311"
expand-macos-universal-tags = true
packages = [ "python/ibm" ]
install-dir = "ibm/qdmi/data"

[tool.scikit-build.install]
components = [ "ibm-qdmi-device_Runtime", "ibm-qdmi-device_Development" ]

[[tool.scikit-build.generate]]
path = "ibm/qdmi/_version.py"
template = '''
version = "${version}"
'''


[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "src/**/*" },
  { file = "include/**/*" },
  { file = "CMakeLists.txt" },
  { file = "cmake/**/*" },
]


[tool.cibuildwheel]
build = "cp3*"
skip = [ "*-musllinux_*", "cp3??t-*", "cp315-*", "*-win_arm64" ]
archs = "auto64"
build-frontend = "uv"
test-command = "pytest test/python --durations=10"
test-groups = [ "test" ]
test-sources = [ "test/python", "test/fixtures" ]

[tool.cibuildwheel.linux]
before-all = "yum install -y openssl-devel"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

# Keep optional Homebrew libraries out of wheels targeting older macOS releases.
# CPR uses Apple's native TLS backend; HTTP/1.1 is sufficient for the REST API.
[tool.cibuildwheel.macos.config-settings]
"cmake.define.CURL_BROTLI" = "OFF"
"cmake.define.CURL_ZSTD" = "OFF"
"cmake.define.USE_NGHTTP2" = "OFF"
"cmake.define.USE_LIBIDN2" = "OFF"
"cmake.define.CURL_USE_LIBSSH2" = "OFF"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg ibm"


[tool.ruff]
line-length = 120
namespace-packages = [ "ibm" ]
src = [ "python" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.lint.per-file-ignores]
"python/ibm/qdmi/__main__.py" = [ "T20" ]
"docs/**" = [ "INP001", "T20" ]
"test/**" = [ "INP001", "T20" ]
"examples/**" = [ "T20" ]

[tool.ruff.lint.isort]
known-first-party = [ "ibm.qdmi" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Conflicts with formatter
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
  "TID252"  # Prefer absolute imports over relative imports from parent modules
]
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "Documentation uses MyST Markdown"


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # ignore block
]

[tool.typos.default.extend-words]
optin = "optin"


[tool.ty.environment]
extra-paths = [ "test/python" ]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
  # PennyLane pins Autograd <1.9; its wraps helper returns in finally on Python 3.14.
  "ignore:'return' in a 'finally' block:SyntaxWarning:.*autograd[/\\\\]wrap_util",
]
log_level = "INFO"
minversion = "9.0"
pythonpath = [ ".", "test/python" ]
strict = true
testpaths = [ "test/python", "test/ci" ]


[tool.coverage]

[tool.coverage.run]
source = [ "ibm.qdmi" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  "@overload",                 # Overloads are only for static typing
  '\.\.\.',
  "def __dir__()",             # Ignore __dir__ method that exists mainly for better IDE support
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError"
]


[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = 'project\(\s*ibm-qdmi-device\s+VERSION\s+(?P<value>\d+\.\d+\.\d+)\s'
